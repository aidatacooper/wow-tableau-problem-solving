  mode: automated
- id: chronological-partition
  description: Both table calculations address ascending exact monthly dates in one
    partition, preserving 48 months across years and no restart.
  mode: automated
- id: filter-order
  description: Trend applies only the late table-calculation date filter; Bars applies
    the ordinary date predicate before aggregation.
  mode: automated
- id: bar-panels
  description: Two separate bar panels show SUM(Sales) and Avg Monthly Sales sorted
    descending by Sales.
  mode: automated
- id: selection-and-reset
  description: Trend min/max actions use the exact month field, and clearing assigns
    the date sentinel to both parameters.
  mode: automated
- id: subcategory-action
  description: Multi-select Bars filters Trend by Sub-Category and clearing removes
    the selection; Bars remains unfiltered by that action.
  mode: automated
- id: numerical-oracle
  description: Independent Decimal raw-CSV and packaged-Hyper SQL model agree on all
    trend and bar rows in 27 scenarios, including sparse categories.
  mode: automated
