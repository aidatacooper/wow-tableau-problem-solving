acceptance:
- id: ww22-bedroom-regex
  description: The description is normalized with REGEXP_REPLACE and the bedroom
    count extracted with REGEXP_EXTRACT (Studio plus digit-Bedroom patterns),
    matching every row.
  mode: automated
- id: ww22-bedroom-groups
  description: A categorical group maps the extracted sizes to Studio, 1-4
    Bedrooms and "More Than 5 Bedrooms".
  mode: automated
- id: ww22-price-bins
  description: 'Price per Night Min/Max implement FLOOR([price]/[Bin Size]) bins,
    # of Listings is COUNTD(name), and Window Avg Price is the grand-total average.'
  mode: automated
- id: ww22-histogram
  description: "The histogram plots # of Listings per price bin with the
    average reference line and the bedroom filter applied."
  mode: automated
- id: ww22-map
  description: The map plots a MAKEPOINT spatial field with listing detail, the
    Area Code Boundaries layer and a listing/price tooltip.
  mode: automated
- id: ww22-interactions
  description: Two Use-as-Filter actions link histo and map, and a URL action on
    the map opens the listing URL.
  mode: automated
remaining_work: []
blocker: null
workarounds:
- Tableau's internal sys_numbin helper is not in the released SDK's function
  catalog and did not bin correctly; the article's FLOOR-based formula is used.
- The extract's latitude/longitude columns carry no geographic role, so the map
  plots a MAKEPOINT([lattitude],[longitude]) spatial field.
capability_gaps: []
related_cwtwb_issues:
- key: extract-lat-lon-have-no-geographic-role
  url: https://github.com/aidatacooper/cwtwb/pull/18
  status: merged
- key: sys-numbin-not-in-catalog
  status: no-change-needed
  note: SYS_NUMBIN is an undocumented Tableau internal; the SDK rejects it
    deliberately and exposes validate_formula=False, with FLOOR as the portable
    equivalent.
