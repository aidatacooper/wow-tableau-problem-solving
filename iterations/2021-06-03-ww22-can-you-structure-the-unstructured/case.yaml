notes:
- The regex chain identifies the bedroom count from the free-text description; a
  categorical group rolls 5+ bedrooms into "More Than 5 Bedrooms".
- The author's bin formula uses Tableau's internal sys_numbin; the replica uses
  the FLOOR([price]/[Bin Size])*[Bin Size] form the article also documents.
- The extract's lat/lon columns have no geographic role, so the map plots a
  MAKEPOINT spatial field.
