  description: An independent running-counter oracle over the locked extract reproduces
    32 teams x 240 regular-season games, a current-streak total of 563 and the longest
    streak (LAC, 224 games).
  mode: automated
- id: ww34-viz-encoding
  description: The Viz sheet is a bar chart with the continuous index on Columns,
    Team, Current Streak and Consecutive Streak on Rows, Season, Week and Player Id
    on Detail, 1-axis-unit right-aligned flat-coloured bars, a hidden streak axis
    and the index axis retitled.
  mode: automated
- id: ww34-dashboard
  description: The fixed 800x1800 dashboard carries the Viz sheet in the author's
    zone geometry plus the challenge, week, credit and source footer texts.
  mode: automated
