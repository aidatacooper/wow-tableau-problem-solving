workarounds:
- Season and Week arrive as integer measures from the extract inspection and a bare
  Week field binds as MONTH(Week), so the workbook re-exposes Season, Week, Player
  Id and a continuous Week Number as explicit discrete calculated fields instead of
  using the raw extract columns.
- configure_chart nests Team and the two streak measures as Team * (Current * Consecutive);
  configure_layered_chart with axis_shelf="columns" is used to emit the author's Team
  / (Current * Consecutive) Rows shelf.
