notes:
- DISTANCE(...,'m') uses the WGS84 Vincenty inverse; the verifier reproduces the
  eight per-pump average distances and death counts from the locked extract.
- The author's three-table 1=1 Hyper relationship returns Cloud 403132, so the
  builder materialises one flat (pump x individual death) Extract.
- The map is four native layers (density heatmap, selected-pump buffer, pumps,
  aggregated deaths) with the normal map style at 0 washout.
