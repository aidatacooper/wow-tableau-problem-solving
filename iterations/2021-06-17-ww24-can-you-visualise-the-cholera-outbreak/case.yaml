remaining_work: []
blocker: null
workarounds:
- A Heatmap (density) mark is gated behind Tableau's Heatmap document-format
  manifest entry; configure_chart writes the mark class but not the flag, so
  Desktop refuses the workbook. The builder calls
  editor._ensure_manifest_entry('Heatmap').
- The author's three-table 1=1 Hyper relationship datasource returns Cloud error
  403132; the builder materialises one flat (pump x individual death) Extract.
- The author's single all-sheets parameter action is written as one parameter
  action per sheet because the released SDK's source_sheets list is
  filter/highlight only.
capability_gaps:
- key: heatmap-mark-manifest-flag
  summary: configure_chart(mark_type='Heatmap') does not add the gated Heatmap
    document-format manifest entry, so Desktop rejects a schema-valid workbook
    with error d2e8da72. The builder's _reconcile_manifest_flags should map the
    Heatmap mark class (and any other gated mark) to its manifest flag.
  upstream_status: merged
