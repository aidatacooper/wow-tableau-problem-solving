  description: Selecting a first product keeps only orders containing that product
    and retains every line item of those orders.
  mode: automated
- id: must-include-second-stage
  description: Adding a second product restricts the result to orders containing
    both products, with the first stage applied as a context filter.
  mode: automated
- id: order-level-totals
  description: Bar Sales and Quantity are order-level sums over all line items of
