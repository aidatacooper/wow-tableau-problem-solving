notes:
- Both PRODUCT sets use the article's "Use All" condition; the first stage is a
  context filter on Bars and Order Detail so the second stage evaluates inside
  the qualifying orders.
- BANs deliberately omits the context flag so {FIXED:COUNTD([Order ID])} keeps
  the unfiltered 5,009-order denominator.
- Dashboard set controls are native setMembership zones via the set_control
  layout node.
- Cloud REST capture exports only the replica's worksheet views; the author
  workbook publishes the dashboard alone.
