notes:
- The whole chart is table calculations addressed by Order ID; the orders are
  ranked by profit descending before the running sums accumulate.
- Passing table_calc_overrides replaces the nested table-calc dependency
  metadata and collapses the curve, so the builder leaves it unset.
- The subtitle references % of Total Profitable and Potential Profitability
  Decrease, which resolve to 79% and 33% exactly as the author's.
