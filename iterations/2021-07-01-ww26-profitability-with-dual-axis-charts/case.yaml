acceptance:
- id: ww26-cumulative-profit
  description: Cumulative Profit is RUNNING_SUM(SUM([Profit])) over orders sorted
    by profit descending, and Count Orders is COUNTD(Order ID).
  mode: automated
- id: ww26-cumulative-percent
  description: Cumulative % of Total Orders is the RUNNING_SUM/WINDOW_SUM ratio over
    the order count and reaches 100%.
  mode: automated
- id: ww26-profitable-marker
  description: Profit is +ve is SUM([Profit]) > 0 and the marker flags the first
    unprofitable order via LOOKUP(-1).
  mode: automated
- id: ww26-subtitle-measures
  description: The Profitable Marker row plus the two WINDOW_MAX fields resolve the
    share of profitable orders and the potential profitability decrease.
  mode: automated
- id: ww26-dual-axis
  description: The Viz is an unsynchronised folded dual axis with a Line pane over
    a Bar pane and Order ID on Detail sorted by profit descending.
  mode: automated
