acceptance:
- id: ww35-year-window
  description: The view is limited to 2020 and 2021 by a context categorical filter
    on YEAR(Order Date) that is also listed in slices, while the extract still
    holds 2018-2021.
  mode: automated
- id: ww35-subcategory-sales
  description: The locked extract reproduces the 2021 values printed in the author's
    pills and the 2020 values implied by the author's dots for every visible
    Sub-Category.
  mode: automated
- id: ww35-percent-change
  description: '% Difference is (SUM(2021 Sales)-SUM(2020 Sales))/SUM(2020 Sales)
    with the +0%;-0% format, so Phones reads +33% and Machines reads -22%.'
  mode: automated
- id: ww35-descending-order
  description: Rows are sorted by SUM(2021 Sales) descending through a computed
    sort on Sub-Category, from Phones to Fasteners.
  mode: automated
- id: ww35-dual-axis-panes
  description: Two panes share one synchronised folded column axis bound to
    SUM(Sales), with the Circle pane above the Bar pane.
  mode: automated
- id: ww35-label-and-colour
  description: Only the circle pane labels % Difference; it colours by
    YEAR(Order Date (copy)) (2021 blue, 2020 red) with a white stroke while the
    bar pane colours by YEAR(Order Date) (2021 grey on top, 2020 red).
  mode: automated
- id: ww35-dashboard-layout
  description: The sheet sits in a 700x800 fixed dashboard carrying the challenge
    author, week and URL credits.
  mode: automated
- id: ww35-desktop-load
  description: Tableau Desktop opens the generated workbook (coordinator-run
    serial Desktop gate; verdict read from Tableau's own log).
  mode: manual
  evidence: evidence/sdk-baseline.json
- id: ww35-cloud-capture
  description: Author and replica images plus the Viz worksheet CSV are captured
