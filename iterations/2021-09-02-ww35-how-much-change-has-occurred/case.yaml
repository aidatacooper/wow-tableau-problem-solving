notes:
- The packaged extract is Orders only (Order Date, Sub-Category, Sales) covering
  2018-2021, so the 2020/2021 window is an observable filter, not a data limit.
- 2021 Sales and 2020 Sales are FIXED LoDs scoped to Sub-Category only; the year
  window is a context filter so it cannot distort the fixed scope.
- The author's blue 2021 pill is a discrete aggregate. cwtwb cannot emit
  Sum+ordinal instances, so a second field SUM([2021 Sales]) declared ordinal is
  used and resolves to usr:...:ok.
- The author's published raster prints each % Difference label one row below its
  mark (13 of 14 shifted labels match the next row); the author's workbook XML
  has no per-row offset, so the workbook is correct and only the image is
  misaligned. The verifier pins the extract to the printed 2021 pills and the
  2020 dot positions and checks the published label sequence with that shift.
- verification_status stays pending and functional_status stays partial until
  the coordinator's serial Desktop and Cloud gates pass.
