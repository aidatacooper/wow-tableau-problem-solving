blocker: null
workarounds:
- cwtwb has add_combined_set but it only authors a native set union, not an intersection.
  The author's 'Products to Include' is an intersection, so the replica expresses
  it as a boolean calculation over the two native sets. Both sets stay dynamic and
  the view still uses exactly one filter field.
capability_gaps:
- key: set-intersection
  description: add_combined_set authors groupfilter function="union" only; there is
    no public API for an intersection or difference combined set.
  status: open
  reusable: true
