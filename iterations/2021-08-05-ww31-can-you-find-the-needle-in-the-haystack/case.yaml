notes:
- The brief says products must 'have a lower than average customer count', but the
  author's own viz keeps all 13 top-50-and-unprofitable products and only colours
  them by that comparison (8 below average, 5 above). The replica follows the author's
  viz; the single filter is the 13-product intersection.
- '''Higher'' is grey and ''Lower'' is orange in the author palette, so the highlighted
  (orange) bars are the products with a lower than average customer count.'
- The unprofitable set's explicit member list is computed from the locked Hyper extract
  inside the builder, not hard-coded, so it stays data-derived.
