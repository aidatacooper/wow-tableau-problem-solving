acceptance:
- id: ww31-filter-field
  description: The view has exactly one categorical filter, it keeps only the true
    members, and it is the only entry on the Filter shelf slices.
  mode: automated
- id: ww31-top50-set
  description: Top 50 Sales by Product is a native top-N set over Product Name ranked
    DESC by SUM(Sales) with count 50 and units records.
  mode: automated
- id: ww31-unprofitable-set
  description: The Unprofitable Products set members equal the products whose SUM(Profit)
    is negative, recomputed independently from the locked extract.
  mode: automated
- id: ww31-customer-average
  description: The FIXED LoD chain (Customer Count Per Product, Count Products, Avg
    Overall Customer Count, Higher than Avg Customer Count) matches the article and
    yields 5.37642 average distinct customers per product.
  mode: automated
- id: ww31-thirteen-products
  description: The Products to Include boolean is exactly [Top 50 Sales by Product]
    AND [Unprofitable Products] and the oracle resolves it to the same 13 products
    the article reports.
  mode: automated
- id: ww31-chart-layout
  description: Chart puts Product Name on Rows and MIN(1) then SUM(Sales) on Columns
    with two panes, the first carrying the Product Name / Sub-Category | Category
    label and the second colouring bars by the customer-count flag on a fixed 0..2
    MIN(1) axis.
  mode: automated
- id: ww31-dashboard
  description: The dashboard is the required fixed 800x650 size and places the Chart
    worksheet.
  mode: automated
