workarounds:
- Use explicit continuous date field semantics and bracketed references rather than
  EXACTDATE on calculated captions to emit native none:qk date instances.
- Explicit public set_datasource_color_palette handles Text mark colours; rank calculation
  gives native regional order.
- Both conditional reference bands attach to the final Area pane on its synchronized
  date axis; negative endpoint Detail fields are present there. This avoids the later
  pane covering the earlier negative band.
