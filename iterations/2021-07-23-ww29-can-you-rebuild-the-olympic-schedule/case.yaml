blocker: null
workarounds:
- A bare date-like field name is auto-wrapped as MONTH(...) by the SDK's default view
  expression, which collapses the day column and the tooltip filters to one mark per
  month; the builder passes the bracketed reference "[Day of Adjusted Date]" to keep
  the discrete day binding.
- The author's highlight action stores the excluded sheet ("Date Chart"); the SDK
  derives that list from the sheets the action is not given, so the action is declared
  on the selector itself to reproduce the same exclusion.
