    pSportToExclude is an empty string parameter; shifting pTimeAdjust moves the recomputed
    marks to different days.
  mode: automated
- id: ww29-schedule-view
  description: Date Chart puts month/day/X-Axis on Columns and Sport Group/Sport/
    MIN(1) on Rows with Shape marks, a final-versus-qualifier shape palette, a fixed
    0..10 axis, the set filter and the Victory Ceremony exclusion.
  mode: automated
- id: ww29-selector-set
  description: Sport Group Set starts with Boxing, Gymnastics and Martial Arts, and
    the Sport Selector bar chart colours its sport groups by set membership with Dummy
    on Detail.
  mode: automated
- id: ww29-viz-in-tooltip
  description: The schedule tooltip embeds VIT-Event Listing filtered by Sport and
    Day of Adjusted Date and VIT-Other Event Bar filtered by Day of Adjusted Date
    only, and the other-sports sheet drops the hovered sport.
  mode: automated
- id: ww29-dashboard-actions
  description: Two menu set actions add and remove sports, one on-hover parameter
    action sets pSportToExclude from Sport, one Dummy highlight action stops the selector
    brushing the schedule, and the selector has a hide/show button.
  mode: automated
