notes:
- The extract carries case-variant duplicates ("Diving"/"diving", "Football"/"football",
  "Rugby"/"rugby", "Volleyball"/"volleyball"), so the raw domains are 36 sport groups
  and 51 sports rather than the article's 34 / 48 cleaned labels. The data is reproduced
  as published.
- 87 rows are Victory Ceremony events; the schedule excludes them but the FIXED LoDs
  still group by the flag, exactly as the author's workbook does.
- X-Axis places qualifying marks at 3 and finals at 7 only when a sport-day has both;
  a finals-only or qualifying-only sport-day stays centred at 5.
