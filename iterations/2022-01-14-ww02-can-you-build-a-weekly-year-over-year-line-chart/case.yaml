- id: week-buckets
  description: Every order date is bucketed to its Monday-Sunday week (datasource start-of-week Monday), and the
    three year groups start and end on 2021-01-04/2021-11-22, 2020-01-06/2020-12-28 and 2019-01-07/2019-12-30.
  mode: automated
- id: complete-weeks-only
  description: No plotted week runs into the fixed Today of 2021-12-01, and the parameter-driven completeness filter
    is present; the extract ends on 2021-11-28, so the guard removes nothing on this dataset.
  mode: automated
- id: year-group-offset
  description: Year Group is YEAR(Today) - YEAR(week start), so the week of 30 Dec 2019 - 5 Jan 2020 stays in a
    single group instead of being split by calendar year.
  mode: automated
- id: baseline-date-axis
  description: All three years are plotted on one continuous 2021 axis, every plotted week lands on a Monday, and
    each current-year week shares its axis position with the previous year.
  mode: automated
- id: yoy-percent-change
  description: The percentage difference compares a week with the same week of the previous year, is addressed by
    Year Group in the workbook, and the oldest year has no value.
  mode: automated
