notes:
- Rebuilt with cwtwb 0.29.0a2 from the packaged Hyper extract using public SDK APIs only; the author workbook was
  never opened by the builder.
- The chart is a single continuous date axis over three year groups. Year Group is a signed offset from the Today
  parameter (YEAR(Today) - YEAR(week start)), written so that Tableau's default ascending member order is Current,
  Previous, 2 Yrs Ago - the order the author fixes with a manual sort.
- 'The load-bearing calculation is Date to Plot: MAKEDATE re-bases a week start onto 2021 but drops the weekday,
  so the three years only share an axis position after the rebased date is truncated back to its Monday. Without
  that truncation the year-over-year table calculation degrades into week-over-week growth.'
- 'Known cwtwb gaps (worked around inside the case): no continuous week-trunc date grain, no dimension member aliases,
  and set_worksheet_rich_title drops fontname. See analysis.md.'
- Final tested runtime is the installed 0.29.0a2 distribution; its installed package has no source-commit metadata.
  CI independently installs the repository requirements pin.
analysis_status: completed
remaining_work: []
workarounds:
- 'The author''s continuous week-truncated date pill has no cwtwb equivalent, so Date to Plot folds DATE(DATETRUNC(''week'',
  ...)) into the calculation and the shelf binds a continuous exact-date axis. Consequence: the x-axis ticks anchor
  on month starts instead of week starts, and the axis scale differs by 0.3%.'
- The author aliases the Year Group members (0/1/2 to Current/Previous/2 Yrs Ago). cwtwb aliases parameters and
  Measure Names only, so a Period Label string calculation supplies the same three labels for the tooltip. The colour
  legend is not displayed, so the numeric members are not visible.
capability_gaps:
- cwtwb exposes DAYTRUNC/MONTHTRUNC/QUARTERTRUNC/YEARTRUNC but no WEEKTRUNC, so a continuous weekly date axis cannot
  be expressed natively. This is what changes the x-axis tick anchor and the 0.3% axis-scale delta.
- No public API to alias the members of a calculated dimension (only parameter members and Measure Names), so a
  numeric dimension cannot show text labels without an extra calculation.
