notes:
- The article's "Region, created from State" custom geographic role has no public
  API; the replica uses one State-geocoded field per region, which yields the same
  region geometry and coloured borders.
- set_geocoding_context(country='United States') is required or the State names
  geocode as world provinces.
- The hover readout uses a Selected City set and an edit-group-action; the text
  is rendered on a dedicated sheet because the custom-label resolver cannot
  traverse the set calculation.
