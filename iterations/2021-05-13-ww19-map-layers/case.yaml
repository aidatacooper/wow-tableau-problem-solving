workarounds:
- The article's custom geographic role ("Region, created from State") is replaced
  by one State-geocoded calculated field per region.
- The selected-city readout is a dedicated text sheet layered over the map
  instead of living on the Sales Text marks card, because the SDK's custom-label
  resolver cannot traverse the set calculation.
