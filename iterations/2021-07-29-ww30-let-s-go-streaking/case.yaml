notes:
- The streak chain only works because every table calculation is addressed by
  Order Date Month alone; that is what restarts LOOKUP/PREVIOUS_VALUE per
  Sub-Category row.
- Sort is a hidden discrete -Longest Streak pill in front of Sub-Category, so
  the list is ordered by streak length while the visible chart keeps the
  author's layout.
- The colour ramp is pinned to a fixed 0..5 domain in five steps; a data-derived
  domain would normalise 2..5 and flatten the legend.
