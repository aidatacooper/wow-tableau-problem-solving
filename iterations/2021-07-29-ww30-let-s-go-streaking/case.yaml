acceptance:
- id: ww30-month-bucket
  description: Order Date Month buckets every order to the first of its month and
    the chart axis is a continuous exact date with 48 distinct points.
  mode: automated
- id: ww30-streak-chain
  description: Sales Diff, Diff Is +ve, Match Prev Value and Increase Streak form
    the article's recursive chain, each addressed by Order Date Month only.
  mode: automated
- id: ww30-longest-streak
  description: Longest Streak is WINDOW_MAX of the running streak and is both
    colour-encoded on a fixed 0-5 five-step green ramp and shown as a discrete pill.
  mode: automated
- id: ww30-peak-sales
  description: Sales of Month with Longest Streak is non-null only on rows where
    the running streak equals the Sub-Category maximum.
  mode: automated
- id: ww30-sort-order
  description: The Chart sorts Sub-Category descending by Sort = -Longest Streak,
    reproducing the article's Appliances/Bookcases/Phones/Art leading rows.
  mode: automated
- id: ww30-viz-shape
  description: The Chart folds a stepped grey line pane and a colour-ramped circle
    pane onto one synchronised row axis.
  mode: automated
- id: ww30-legend
  description: The Legend sheet renders the author's CASE-ordered Sub-Category
    squares on the same five-step green ramp.
  mode: automated
remaining_work:
- Desktop LOADED gate has not been run for this artifact; the coordinating
  maintainer runs build_and_check.py serially and must confirm LOADED before the
  case can be recorded as replicated.
- Cloud capture has not been re-taken after the structural fixes (discrete Sort
  pill, MONTHTRUNC axis, per-pane tooltip runs). The first capture rendered every
  replica sheet empty; a re-capture must confirm the dashboard renders and the
  Data CSV matches the oracle row by row.
- visual_status stays not_evaluated until an accepted Cloud image exists.
blocker: null
workarounds:
- The month axis must use the native MONTHTRUNC(Order Date) derivation; binding
  EXACTDATE(<calculated date>) writes an instance Tableau cannot resolve and
  every sheet renders empty on Cloud.
- Custom-tooltip runs must reference the bare date field; a run on
  EXACTDATE(<date field>) blanks the whole worksheet on Cloud (batch-17 finding).
- The hidden Sort key must be a discrete ordinal pill; a quantitative leading
  pill emits an extra axis instead of nesting under Sub-Category.
