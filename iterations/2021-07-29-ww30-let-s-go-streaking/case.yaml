workarounds:
- Complete missing month/category combinations with null-sales scaffold rows derived
  from locked inputs. ZN Sales Diff then breaks streaks across missing months exactly
  as author Tableau domain completion does.
- Use a leading discrete negative-streak Sort pill. Computed sorting by a table calculation
  blanks the Cloud chart; native pill ordering achieves the required order.
- Explicitly bind nested table-calculation dependencies to the native month instance.
  Custom tooltip omits an unbound calculated-date token; axis labels retain month.
