workarounds:
- The layered Pie wedge_size configuration is not serialized by this SDK. The builder
  derives a two-slice scaffold from raw input rows and uses a native Pie plus Circle
  dual axis; COUNTD preserves respondent semantics.
- A layered single-pane chart applies a computed column sort for sentiment answers;
  the basic chart sort applies only to rows.
capability_gaps:
