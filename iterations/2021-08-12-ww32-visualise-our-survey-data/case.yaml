acceptance:
- id: ww32-distinct-respondents
  description: Distinct respondent counting yields 63 people from 1134 question rows;
    track counts are Tableau 42, Both 11, and PBI 10.
  mode: automated
- id: ww32-filtered-percentages
  description: Independent raw-data oracle covers track and participation intersections;
    percentages sum to one within each question.
  mode: automated
- id: ww32-neutral-halves
  description: Positive and negative sentiment each include half of neutral responses,
    preserving the whole population.
  mode: automated
- id: ww32-answer-ranking
  description: Requested subjects use unique count ranking partitioned by question.
  mode: automated
- id: ww32-native-actions
  description: Two selectors each filter four other sheets; sentiment charts have
    linked hover highlighting.
  mode: automated
