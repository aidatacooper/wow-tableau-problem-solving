notes:
- The benchmark is the mean of Sub-Category totals within each Category, built
  with the article's two Quick LoDs; averaging raw order rows gives a different
  figure for every Category.
- The Category-average GanttBar pane sits behind the Sales bars on a
  synchronised dual axis, giving each Category a constant backdrop.
- The Difference field carries the *▲0%;▼0% custom format so the sign renders
  as an up or down triangle.
