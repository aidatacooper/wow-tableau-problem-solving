workarounds:
- name: dual-axis-color-palette
  description: Cloud Server does not honor the cwtwb-injected Measure Names color
    encoding for the dual-axis panes. Bars fall back to Tableau's default
    categorical palette (blue/orange) instead of the author's Men/Women pair
    (purple/green). The structural and numerical agreement is unaffected.
    The Headcount Gap pane accepts the encoding and renders orange correctly.
    No release-blocker; the visualization is functionally complete.
capability_gaps:
- name: dual-axis-measure-names-color-encoding
  description: cwtwb writes a per-pane Measure Names palette encoding via
    a style-rule element=mark block, but Tableau Cloud Server's renderer applies
    the encoding to the extra-axis pane (the Headcount Gap) and not to the
    synchronized dual-axis panes (Males/Females). The panes fall back to
    Tableau's default categorical palette. Neither per-pane mark color
    overrides nor a re-save cycle are available via cwtwb's public API today.
