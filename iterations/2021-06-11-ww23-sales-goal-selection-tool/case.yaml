workarounds:
- A quantitative filter with both min=1 and max=1 on INDEX() did not collapse the
  BANs to one row on Cloud; only the upper bound (max=1) is written, matching the
  author's workbook.
- The customized labels drop literal angle brackets because a literal '<' run
  plus a field run renders as '<<field>>'.
