notes:
- The two goals are "same pace" (this year's run-rate extrapolated with DATEDIFF
  day counts) and "last year + X%" (2020 sales times 1+pPercentIncrease).
- YEAR-END GOAL Per Sub Cat branches on ATTR of the "Use Last Year With
  Increase" set; WINDOW_SUM plus INDEX()<=1 aggregate the mixed goals into the
  single-row BAN strip.
- The set starts with the author's four members (Accessories, Copiers,
  Machines, Phones); two edit-group-action set actions add and remove members.
