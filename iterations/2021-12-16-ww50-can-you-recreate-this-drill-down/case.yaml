notes:
- The published author workbook retains the earlier pLevel/DD Level route; the blog's final solution uses only pSelectedCategory
  and pSelectedSubCat. The replica implements the final two-parameter route, which satisfies the official requirements.
- Cloud images capture REST parameter states, not browser click execution. The reset path is proved by the emitted
  Sub Cat Display / FILTER formulas and a four-state monthly oracle; Desktop opens the packaged workbook.
- Category bars remain in natural order because the released chart API exposes one descending shelf sort; the inner
  Sub Cat Display sort and every value are preserved.
- The author workbook was used for analysis only and is not stored in the iteration.
- Tableau Public re-zips the author TWBX per request, so its ZIP hash changes between downloads; the extracted Hyper
  hash 6a35f8f3cb85cd731d40dc15eba6d43be13dd047dfb449385786924e859f19c9 is stable and is what the builder consumes.
- The final author and replica Bookcases REST captures both expand Furniture. Earlier capture observations do not
  describe the final images.
