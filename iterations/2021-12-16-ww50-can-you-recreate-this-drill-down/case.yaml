acceptance:
- id: parameters
  description: pSelectedCategory and pSelectedSubCat are string parameters defaulted to the empty string and accept
    any typed value.
  mode: automated
- id: drill-display
  description: Sub Cat Display shows a Sub-Category only under the currently selected Category; the bar chart stacks
    Category then Sub Cat Display on Rows.
  mode: automated
- id: selection-filter
  description: The FILTER calculation keeps all rows with no selection, Category rows with only a Category selected,
    and Category plus Sub-Category rows when both are selected.
  mode: automated
- id: reset-semantics
  description: Clicking Furniture then Bookcases then Technology produces Technology with a blank Sub-Category,
    so the line chart resets to the new Category.
  mode: automated
- id: bar-chart
  description: The bar chart is a Bar mark with Category on Colour, Sales labels, hidden axis and row field labels,
    and Sub Cat Display sorted descending by Sales.
  mode: automated
- id: line-chart
  description: The line chart uses continuous month-truncated Order Date, SUM(Sales), parameter colour, FILTER =
    True, both tooltips and min/max labels.
  mode: automated
- id: dashboard-layout
  description: A single fixed 500 x 600 dashboard contains the Bar Chart and Line worksheets once each and the Sales
    Drill Down title.
  mode: automated
- id: parameter-actions
  description: Two on-select parameter actions read Category and Sub Cat Display and clear both targets to the empty
    string.
  mode: automated
- id: monthly-oracle
  description: An independent SQLite oracle over 9,994 packaged lines matches the default, Category, Sub-Category
