remaining_work: Real hover, year selection, multiselect, clear, no-grey behavior and
  URL clicks remain unverified while browser MFA is unavailable. Current default numerical
  and visual acceptance passed independent review; Desktop LOADED and 50-case corpus
  passed. Functional status remains partial.
workarounds:
- Materialize 500 gradient segments per year from raw challenge counts instead of
  author relationship densification/table calculations; independently verify every
  segment.
- Use one typed union datasource with fixed Kind filters to make the Year dashboard
  action unambiguous.
- Author datasource mapped-images and a resource record through exported convert_workbook/read_workbook
  native-JSON APIs on the independently blank-built workbook. Numeric bounds come
  from analysis and PNG from extracted inputs; no author workbook/XML/JSON is read
  or copied. Structural API workaround, not semantic API pass.
- Public native-JSON repair registers the custom-shape style field column-instance
  at datasource scope from our own worksheet dependency and removes the unregistered
  named palette attribute. Synthetic released-a2 reproducer in probe_shape_binding.py.
  Mapped image uses file:Images/christmas-tree.png instead of a quoted literal.
