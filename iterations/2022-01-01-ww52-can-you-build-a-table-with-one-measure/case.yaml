workarounds:
- id: asymmetric-colour-range
  description: The public colour-style setter omits the symmetric flag. Native JSON conversion sets symmetric=false
    so negative subtotal percentages retain their own green colour range beside positive currency amounts.
- id: totals-placement
  description: The public SDK has no onTop setter, so the builder patches the rows shelf through documented native
    JSON conversion of its own generated workbook.
- id: subtotal-label-field
  description: The SDK couples the subtotal label to the subtotaled field; a second header format places the visible
    label on Sub-Category.
