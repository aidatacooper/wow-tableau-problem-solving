acceptance:
- id: extract-status-classification
  description: Extract Status follows the author's finish_code/progress rules, so
    the three cancelled tasks fall through to Failed and the three unfinished
    tasks report In Progress.
  mode: automated
- id: waiting-and-processing-durations
  description: Waiting and processing times are second-differences over 86400, with
    unfinished tasks measured against the Now parameter rather than a null.
  mode: automated
- id: baseline-same-day-normalisation
  description: Created At Baseline and Started At Baseline keep the time of day but
    move every task onto 2021-01-01, so one 24-hour axis covers all days.
  mode: automated
- id: over-wait-threshold-flag
  description: Over Wait Time Threshold is Waiting Time > 0.007, i.e. a wait longer
    than ten minutes, and splits the population rather than flagging everything.
  mode: automated
- id: days-to-show-filter
  description: Filter Days to Show keeps the last pDaysToShow days ending at Now, so
    the 1/5/7/10-day windows select strictly more tasks as the parameter grows.
  mode: automated
- id: gantt-dual-axis-encoding
  description: The Gantt sheet has two GanttBar panes on both baselined datetime
    axes, folded and synchronised, sized by waiting/processing time, coloured by
    threshold/status, with the 08:00-17:00 reference band.
  mode: automated
- id: key-legend-pairing
  description: The Key sheet plots Key Label against MIN(1) for Sites 7 and 9, sized
    and coloured by Site, with Waiting sorted before Processing by Key Order.
  mode: automated
- id: dashboard-controls-and-legends
  description: The 1000x800 dashboard carries the pDaysToShow slider, the Site
    check-dropdown, the Key sheet, both native colour legends, the Gantt sheet and
    the challenge footer text.
  mode: automated
- id: locked-input-and-round-trip
  description: The packaged extract hash matches source-lock.json, the workbook
    round-trips through the SDK, and no unresolved table-calculation or
    ordering-field metadata remains.
  mode: automated
