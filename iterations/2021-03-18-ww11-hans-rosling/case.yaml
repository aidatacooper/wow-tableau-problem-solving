blocker: null
workarounds:
- Materialize one normalized Extract table (Country, Year, Life Expectancy, Income,
  Population, Region) from the locked matrices and connect it single-table, instead
  of using set_hyper_connection's multi-table logical relationships, which Cloud
  refuses to connect to.
- Substitute a Year parameter and Selected Year filter for the author's Pages-shelf
  animation.
capability_gaps:
- key: pages-shelf
  description: No public API exposes the Pages shelf, so a native animated pager
    cannot be authored; the case substitutes a parameter-driven year filter.
  upstream_status: pr-open
- key: hyper-logical-multi-table
  description: set_hyper_connection with tables+relationships produces a datasource
    Tableau Cloud rejects with 403132 'failed to establish a connection to your
    datasource'; reproduced with one and three relationships and with the shared
    year key forced to a dimension.
  upstream_status: skipped
