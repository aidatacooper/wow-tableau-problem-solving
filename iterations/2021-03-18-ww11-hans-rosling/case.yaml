notes:
- The author's animated scatter is driven by the Pages shelf, which the SDK does
  not expose. A Year parameter plus a Selected Year filter reproduces the year
  selection interactively; see capability_gaps.
- Income and life expectancy are continuous dimension-typed fields, matching the
  article's "change to Dimension" instruction; aggregate shelf expressions render
  an empty view on this extract.
- The normalized extract is materialized by the builder from the locked matrices;
  the author's native multi-table relationship path is recorded as a bug finding.
