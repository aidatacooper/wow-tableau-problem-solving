acceptance:
- id: rosling-country-facts
  description: For the selected year each mapped country is one mark positioned by
    its income and life expectancy, sized by population and coloured by region, with
    null-region countries excluded.
  mode: automated
- id: rosling-log-income-axis
  description: The income axis carries a logarithmic scale so the income spread is
    readable rather than crushed into the left edge.
  mode: automated
- id: rosling-region-highlight
  description: A highlight action sources the Region sheet into the dashboard so
    selecting a region isolates its bubbles.
  mode: automated
