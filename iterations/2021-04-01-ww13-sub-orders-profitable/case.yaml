notes:
- An order counts as profitable for a Sub-Category only when the summed profit of
  that Sub-Category's lines on the order is positive; this is a FIXED LoD at the
  Order ID + Sub-Category grain.
- The bars are positioned by the cumulative share of sales, so the Sub-Category
  sits on Detail rather than a shelf; the author's string Sort key drives the
  computed sort.
- The two heights are two panes of one worksheet sharing the row axis, with the
  lower pane's axis reversed and a constant zero reference line between them.
