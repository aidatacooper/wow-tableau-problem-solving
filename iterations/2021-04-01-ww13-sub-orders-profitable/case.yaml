acceptance:
- id: ww13-order-grain-profitability
  description: An order counts as profitable for a Sub-Category only when the sum
    of that Sub-Category's profit on the order is positive, implemented as a FIXED
    LoD at the Order ID and Sub-Category grain rather than a per-row test.
  mode: automated
- id: ww13-profitable-percentage
  description: The upper bar height is the profitable-order percentage, computed as
    the summed profitability flag over the distinct order count, and the lower bar
    is one minus that percentage.
  mode: automated
- id: ww13-width-by-sales-share
  description: Each column's width is the Sub-Category's share of total sales,
    carried on the Size encoding of both panes, with the bars positioned by a
    cumulative-sales axis rather than the Sub-Category dimension.
  mode: automated
- id: ww13-stacked-height
  description: The profitable and non-profitable measures occupy two panes of one
    worksheet with the lower axis reversed, separated by a constant zero reference
    line.
  mode: automated
- id: ww13-sort-order
  description: Columns are ordered by the profitable percentage descending then by
    sales descending, driven by the string Sort key and a computed sort on
    Sub-Category.
  mode: automated
