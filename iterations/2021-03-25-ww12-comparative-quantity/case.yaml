acceptance:
- id: ww12-include-lod-average
  description: Each Sub-Category's left bar is the average quantity inclusive of
    manufacturer, computed as the INCLUDE [Manufacturer] sum averaged over the
    manufacturer grain rather than over raw order rows.
  mode: automated
- id: ww12-exclude-lod-variance
  description: The right bar is each Sub-Category's average minus the selected
    Sub-Category's average, produced by the EXCLUDE LoD that spreads the selected
    value across every row, and is zero for the selected row.
  mode: automated
- id: ww12-parameter-action
  description: Selecting a Sub-Category bar sets pSelectedSubCat through a native
    parameter action, recomputing the variance against the new baseline.
  mode: automated
- id: ww12-no-fixed-lod
  description: No FIXED LoD expression appears in the workbook, honouring the
    challenge constraint.
  mode: automated
- id: ww12-selected-color
  description: The average panel colours by the boolean Is Selected Sub Cat field
    with distinct selected/unselected palette entries, and the variance panel
    carries a continuous colour palette.
  mode: automated
