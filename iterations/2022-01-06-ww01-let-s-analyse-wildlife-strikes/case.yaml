notes:
- Rebuilt with cwtwb 0.29.0a2 from the packaged Hyper extract using public SDK APIs only; the builder never opens
  the author workbook.
- Two-table logical model - strikes (251,818 rows) related to a 56-row packaged spatial extract on State Name =
  NAME - with a top-10 species set, a parameter-driven bar/map/area dashboard and a null-state indicator.
- 'Workaround 1: TABLEAU.TABGEOGRAPHY is inspected as string, so the author''s geometry encoding renders no marks.
  The map uses Tableau''s native state geographic role; per-state counts and the red-gold palette are preserved.'
- 'Workaround 2: initialize_dashboard_filter_action cannot express the all-members default state, which must retain
  the 36,959 null-state records. State Filter / Species Filter calculations driven by the same two parameters as
  the titles reproduce select and clear behaviour.'
analysis_status: completed
remaining_work: []
workarounds:
- id: geometry-role
  description: TABLEAU.TABGEOGRAPHY is inspected as a string by the released SDK, so the replica uses Tableau's
    native state geographic role while preserving state counts and the red-gold palette.
- id: all-members-default
  description: initialize_dashboard_filter_action cannot express the all-members default state, so State Filter
    and Species Filter calculations preserve the null-state records and reproduce select and clear behavior.
