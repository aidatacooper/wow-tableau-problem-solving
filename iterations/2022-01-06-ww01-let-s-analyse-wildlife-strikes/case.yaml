    is exactly the remainder.
  mode: automated
- id: state-selection
  description: The Alabama REST parameter state yields bar/area total 1,842, preserves Unknown Location 36,959 and
    updates titles; static action wiring connects map selection.
  mode: manual
  evidence: evidence/cloud-verification.json
- id: species-selection
  description: The Unknown Bird REST parameter state yields map/area total 101,949 and Unknown Location 19,939;
