acceptance:
- id: ww14-second-order-grain
  description: Only a customer's second order contributes, identified by a FIXED LoD
    on the minimum order date after the customer's first order rather than by row
    order.
  mode: automated
- id: ww14-selected-subcat-orders
  description: Both charts count orders that contain the selected Sub-Category,
    selected by the order-level LoD summing the per-row match flag to at least one.
  mode: automated
- id: ww14-other-items-exclusion
  description: The selected Sub-Category is recoded to N/A and excluded, so a
    Sub-Category never recommends itself.
  mode: automated
- id: ww14-order-count-ranking
  description: Bars and treemap tiles are ordered by the distinct order count
    descending, and the treemap sizes tiles by that count.
  mode: automated
- id: ww14-profitability-colour
  description: Marks are coloured by whether the other Sub-Category's profit ratio
    is positive, using a two-entry boolean palette shared by both charts.
  mode: automated
- id: ww14-toggle-switch
  description: Selecting on the Toggle control writes the Toggle parameter through
    a native parameter action, and each chart is gated on the parameter so exactly
    one renders.
  mode: automated
