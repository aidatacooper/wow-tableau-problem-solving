notes:
- 'Current is the maximum date in the data (2021-12-30); the current window is the
  N months ending there and the previous window ends one month earlier.'
- The percentile fields are addressed by Columns; any narrower addressing makes
  WINDOW_PERCENTILE compute per-cell and classifies every row as Top.
- The chart overlays a quartile-coloured bar over a previous-sales Gantt bar on a
  folded, synchronised dual axis, with the contraction circle on a hidden row.
