notes:
- The five-row extract is dummy data; everything the map draws comes from
  parameters.
- Acres to Feet converts the area to a radius (SQRT((acres*43560)/PI())) because
  BUFFER takes a distance.
- The invisible zoom ring is a real map layer so the extent zooms out; it is made
  fully transparent and inert.
