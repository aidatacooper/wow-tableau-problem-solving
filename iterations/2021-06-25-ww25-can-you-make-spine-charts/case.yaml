workarounds:
- PERCENTILE(...) is not in the released SDK's aggregation derivation map, so a
  bare PERCENTILE(...) field is registered as an unknown dimension and the pane
  renders empty; passing table_calc='Rows' when adding the quartile fields makes
  them resolve as measures.
capability_gaps:
- key: percentile-aggregation-not-recognized
  summary: The field registry's _DERIVATION_MAP and _AGGREGATE_FUNCTION_RE omit
    PERCENTILE, so a calculated field whose formula is a bare PERCENTILE(...) is
    registered as an unknown dimension and any worksheet binding it renders
    empty. Adding PERCENTILE (and the other Tableau percentile-style
    aggregations) to the registry would make it work without a table-calc hint.
