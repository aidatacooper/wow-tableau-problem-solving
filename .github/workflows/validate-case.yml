name: Validate contributed case

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_builders:
        description: Rebuild and verify every v1 case
        required: false
        default: false
        type: boolean
  # Runs on every pull request, including docs-only changes. A path filter
  # here would leave the required 'validate' check permanently unreported on
  # PRs that touch only docs/ or usage/, blocking them forever. The expensive
  # steps are already scoped: validate_changed_cases.py exits immediately when
  # no iteration changed.
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - if: github.event_name == 'pull_request'
        run: python scripts/validate_changed_cases.py --base-ref origin/${{ github.base_ref }}
      - if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_builders != true)
        run: python scripts/validate_changed_cases.py --all --metadata-only
      - if: github.event_name == 'workflow_dispatch' && inputs.run_builders
        run: python scripts/validate_changed_cases.py --all
      - if: github.event_name == 'workflow_dispatch' && inputs.run_builders
        run: git diff --exit-code -- iterations
