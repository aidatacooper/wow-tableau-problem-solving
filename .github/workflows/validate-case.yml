name: Validate contributed case

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "*.py"
      - "iterations/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - if: github.event_name == 'pull_request'
        run: python scripts/validate_changed_cases.py --base-ref origin/${{ github.base_ref }}
